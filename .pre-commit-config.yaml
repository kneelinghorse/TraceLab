# ABOUTME: Pre-commit hooks for code quality enforcement.
# ABOUTME: Runs ruff linting/formatting and basic file hygiene checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ["--fix"]
      # ruff-format hook removed (2026-06-01): the repo was never kept
      # ruff-format-clean, so running it churned large amounts of unrelated
      # pre-existing code on every touched file, fighting surgical diffs. Lint
      # (ruff above) is kept — it catches real issues without reformatting.

  - repo: local
    hooks:
      - id: no-credential-literals
        name: Reject hard-coded credential literals
        entry: python scripts/check_no_credential_literals.py
        language: system
        pass_filenames: true
        types: [text]
      - id: no-mcp-dist
        name: Reject staged MCP package dist/ files
        entry: scripts/check_no_mcp_dist.sh
        language: script
        pass_filenames: true
        files: ^packages/[^/]+/dist/
