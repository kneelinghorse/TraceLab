# Mission File: B6.6_Integration-API.yaml

missionId: "B6.6"

objective: "Add integration endpoints for external Mission Protocol MCP server to create missions in TraceLab and poll status."

context: |
  Mission Protocol MCP is external tool with 26 domain packs (technical research, build missions, etc)
  that generates structured YAML missions. TraceLab is the evidence collection and synthesis tool.
  Integration workflow: Agent uses Mission Protocol MCP to create research.deep-research-technical
  mission YAML -> YAML references TraceLab project "Semantic-Hub" -> Agent uses TraceLab CLI to
  query docs -> Agent links chunks as evidence -> TraceLab synthesizes -> exports MD/PDF report.
  Need integration endpoints for Mission Protocol MCP to create missions in TraceLab via API.

successCriteria:
  - "Integration endpoint POST /api/v1/integration/mission-protocol/projects/lookup finds or creates project by name."
  - "Integration endpoint POST /api/v1/integration/mission-protocol/missions creates mission with auto project lookup from YAML."
  - "Integration endpoint GET /api/v1/integration/mission-protocol/missions/{id}/status returns completion %, evidence count, synthesis status."
  - "Accepts Mission Protocol YAML format compatible with MCP output."
  - "Documentation in docs/mission_protocol_integration.md with example workflows."
  - "Example YAML missions demonstrating TraceLab integration."

deliverables:
  - "app/api/v1/integration.py - Integration endpoints."
  - "app/schemas/integration.py - Integration request/response schemas."
  - "docs/mission_protocol_integration.md - Integration guide with examples."
  - "examples/mission-protocol/ - Example YAML files."
  - "Pytest tests for integration endpoints."

domainFields:
  type: "Build.Implementation.v1"

  researchFoundation:
    - finding: "Mission Protocol MCP has 26 domain packs including research.deep-research-technical."
      sourceMission: "Mission Protocol MCP server list_available_domains"
    - finding: "Mission import endpoint already exists at /api/v1/missions/import."
      sourceMission: "app/api/v1/missions.py:87-98"

  implementationScope:
    coreDeliverable: "Integration API for external Mission Protocol MCP communication."
    outOfScope:
      - "Webhooks for mission completion (defer to Sprint 07)."
      - "Real-time status streaming (defer to Sprint 07)."
      - "Bidirectional sync (defer to Sprint 07)."

  validationProtocol:
    - validator: "Integration test"
      focus: "Create mission via integration API, poll status, verify data."
    - validator: "pytest tests/integration/test_mission_protocol_integration.py"
      focus: "API endpoints, YAML parsing, project lookup."

  handoffContext:
    completed:
      - "Integration endpoints functional."
      - "Mission Protocol MCP can create TraceLab missions."
      - "Status polling works."
    interfaces:
      - "POST /api/v1/integration/mission-protocol/projects/lookup"
      - "POST /api/v1/integration/mission-protocol/missions"
      - "GET /api/v1/integration/mission-protocol/missions/{id}/status"
    assumptions:
      - "Mission APIs operational (Sprint 03)."
      - "YAML import functional."
    nextMission: "B6.7: Sprint Retrospective"
    blockers: []

