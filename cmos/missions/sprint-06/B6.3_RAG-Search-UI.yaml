# Mission File: B6.3_RAG-Search-UI.yaml

missionId: "B6.3"

objective: "Build semantic search and RAG query interface with results display, LLM synthesis view, and citation linking."

context: |
  TraceLab has semantic search and RAG query APIs operational from Sprint 02 but no UI. Users need
  to query their 100s-1000s of uploaded documents, view semantic search results with relevance scores,
  see LLM-synthesized answers with citations, and save results as evidence for missions. Search UI
  must support filtering by project, document type, and date ranges. Results should link to source
  documents and allow quick-add to missions as evidence.

successCriteria:
  - "Search page at /search with query input, project selector, and filter options (document type, date range)."
  - "Semantic search results display chunks with relevance scores, source document names, and links to document detail."
  - "RAG synthesis view shows LLM-generated answer with numbered citations linking to source chunks."
  - "Quick-add evidence button on results allows linking chunks to missions."
  - "Query history stored locally (localStorage) for user convenience."
  - "Loading states and error handling for search operations."
  - "API client in frontend/src/lib/api/search.ts handles search and RAG endpoints."

deliverables:
  - "frontend/src/pages/search/index.tsx - Main search interface."
  - "frontend/src/pages/search/results.tsx - Results display (or integrated in index)."
  - "frontend/src/components/SearchBar.tsx - Query input component."
  - "frontend/src/components/ResultCard.tsx - Search result display."
  - "frontend/src/components/RagSynthesis.tsx - LLM answer with citations."
  - "frontend/src/lib/api/search.ts - Search API client."
  - "frontend/src/types/search.ts - Search result types."
  - "Updated Navigation to include Search link."

domainFields:
  type: "Build.Implementation.v1"

  researchFoundation:
    - finding: "Search API returns chunks with scores, document metadata, and chunk IDs."
      sourceMission: "app/api/v1/search.py"
    - finding: "RAG API returns answer text with citations array linking to source chunks."
      sourceMission: "app/api/v1/retrieval.py"

  implementationScope:
    coreDeliverable: "Semantic search + RAG query UI with citation navigation."
    outOfScope:
      - "Advanced filters (faceted search) (defer to Sprint 07)."
      - "Search suggestions/autocomplete (defer to Sprint 07)."
      - "Search analytics (defer to Sprint 07)."

  validationProtocol:
    - validator: "Manual UI test"
      focus: "Search query, view results, click citations, add to mission."
    - validator: "TypeScript type-check"
      focus: "npm run type-check passes."

  handoffContext:
    completed:
      - "Search UI functional with semantic and RAG modes."
      - "Citation linking works."
      - "Evidence quick-add operational."
    interfaces:
      - "Routes: /search"
      - "POST /api/v1/search, POST /api/v1/rag/query"
    assumptions:
      - "Search APIs operational (Sprint 02)."
      - "Documents exist to search."
    nextMission: "B6.4: Mission UI Overhaul"
    blockers: []

