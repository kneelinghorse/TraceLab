---
apiVersion: mission.protocol.v2
kind: Mission
metadata:
  id: B12.3
  name: Create Service Account in Production
  sprint: Sprint 12
  type: Build.Setup.v1
  priority: critical
  created: 2025-12-05
  owner: assistant

missionId: "B12.3"

spec:
  objective: |
    Enable DeepSearch to authenticate with TraceLab production API.

  context: |
    **Architecture Discovery:**
    TraceLab auth is SINGLE-USER via environment variables (not a database of users).
    See app/core/security.py - `get_configured_credentials()` reads AUTH_USERNAME/AUTH_PASSWORD.

    **Current Production:**
    - AUTH_USERNAME=kneelinghorse (human account)
    - AUTH_PASSWORD=Bigpuma
    - This is the ONLY account that works

    **Options:**

    1. **SIMPLE (Recommended):** DeepSearch uses existing human credentials
       - No changes needed to Railway
       - Both human and agent use same account (it's internal anyway)
       - Update DeepSearch config to use kneelinghorse/Bigpuma

    2. **REPLACE:** Change Railway env vars to deepsearch-service
       - Breaks human login
       - Not recommended unless human never needs to login

    3. **MULTI-USER (Future):** Modify auth system to support multiple accounts
       - Requires code changes to security.py
       - Out of scope for Sprint 12
       - Consider for future if needed

    **Recommendation:** Option 1 - share credentials. This is a single-builder internal
    tool, not a multi-tenant system. Adding complexity for separate service accounts
    is premature.

  success_criteria:
    - DeepSearch can authenticate at https://api.namozine.com/api/v1/auth/login
    - Token returned is valid for all API endpoints
    - DeepSearch can successfully call /api/v1/pedr/preflight
    - Decision documented on which approach was taken

  deliverables:
    - DeepSearch configured with working credentials
    - Update DeepSearch answers doc with final credentials
    - Document decision (shared vs separate account)

  test_plan:
    - POST /api/v1/auth/login with chosen credentials
    - Use returned token to call /api/v1/projects (no trailing slash!)
    - Use token to call /api/v1/pedr/preflight with test query

  estimated_effort: 30 minutes (if using shared credentials)
  dependencies:
    - B12.2 (redirects should be fixed so auth works properly)

  notes: |
    If multi-user auth is needed later, create a new mission to:
    1. Modify app/core/security.py to support credential list or DB lookup
    2. Add user management endpoints
    3. Update Railway with multiple accounts

    For now, shared credentials are appropriate for internal single-user tool.
