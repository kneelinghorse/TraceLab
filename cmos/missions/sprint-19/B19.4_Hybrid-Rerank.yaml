notes: |
  This is a FALLBACK strategy if B19.1 + B19.3 don't achieve targets.
  The existing content_tsv GIN index enables fast FTS.

  Only implement if HNSW tuning alone doesn't get us to <500ms.
  Hybrid adds complexity and slightly reduces recall.
