# Mission File: B2.3b_Onboarding-API-and-CLI.yaml

missionId: "B2.3b"

objective: "Deliver the ingest onboarding API and Typer-based CLI defined in R2.3 so projects and documents can be registered without direct database access."

context: |
  Research mission R2.3 established the blueprint for a production-ready onboarding workflow: FastAPI backend with asynchronous ingestion jobs, OAuth 2.0 device authorization, idempotency keys, saga-based compensations, and a Typer CLI that agents can script. This mission implements that design to unblock ingestion-focused missions and provide a repeatable setup path.
  
  Key components:
  - FastAPI onboarding service exposing RESTful endpoints (`/projects`, `/documents`, `/jobs`) with async ingestion triggers.
  - OAuth device-flow authentication for the CLI, plus per-user authorization rules.
  - Idempotency key handling and compensating transactions to keep project/document state consistent across failures.
  - Typer CLI (`ingest-cli`) delivering ergonomic commands for project/document lifecycle and ingestion status polling.

successCriteria:
  - "FastAPI onboarding service implements project/document CRUD, ingestion job creation, and saga compensations for partial failures."
  - "Device authorization flow functional: CLI prompts users with verification URL + code, exchanges tokens, and stores credentials securely."
  - "All POST/PATCH endpoints accept `Idempotency-Key` headers and return cached responses on retries."
  - "Ingestion trigger endpoints respond with HTTP 202 Accepted + Location header; polling endpoint returns job status (PENDING/INGESTING/COMPLETED/FAILED)."
  - "`ingest-cli` commands cover project create/list/show, document add/list/status, and `document ingest --wait` with progress output."
  - "Telemetry (OpenTelemetry traces/logs) emitted for onboarding API requests and CLI-triggered ingestion jobs."

deliverables:
  - "FastAPI service module (`app/onboarding/api.py`) with routers, Pydantic schemas, and async job orchestration."
  - "Device-flow auth client + token storage implementation conforming to R2.3 guidance."
  - "Idempotency middleware/cache (e.g., Redis) and saga compensation handlers documented and tested."
  - "`ingest-cli` Typer application with subcommands, configuration management (env + YAML contexts), and rich error messaging."
  - "Integration tests demonstrating CLI → API → queue sequence across success and failure paths."
  - "Documentation/runbook covering environment setup, auth configuration, and troubleshooting."

domainFields:
  type: "Build.Implementation.v1"

  read for context researchFoundation:
    - finding: "CLI must use Python + Typer with YAML config contexts and device authorization flow."
      sourceMission: "cmos/missions/research/R2.3_Bootstrap-Workflow.md"
    - finding: "Onboarding API requires idempotency keys, async ingestion pattern (HTTP 202 + Location), and saga compensations."
      sourceMission: "cmos/missions/research/R2.3_Bootstrap-Workflow.md"
    - finding: "Telemetry and distributed tracing should span CLI, API, and ingestion pipeline."
      sourceMission: "cmos/missions/research/R2.3_Bootstrap-Workflow.md"
    - finding: "Markdown ingestion pipeline (B2.3a) consumes onboarding output to maintain consistent identifiers."
      sourceMission: "cmos/missions/research/R2.2_markdown-ingestion-service-design-spec.md"

  implementationScope:
    coreDeliverable: "Authenticated onboarding surface (API + CLI) that agents can use to register projects/documents and trigger ingestion jobs."
    outOfScope:
      - "UI front-end for onboarding (CLI only for this mission)."
      - "Actual ingestion worker implementation (B2.3a)."
      - "Semantic cache logic (B2.3d)."

  validationProtocol:
    - validator: "Auth Flow Test"
      focus: "Device authorization completes successfully and refresh tokens rotate as expected."
    - validator: "Idempotency Test"
      focus: "Repeated POST requests with identical idempotency key return cached response without duplicate records."
    - validator: "Async Job Test"
      focus: "`ingest document ingest --wait` polls job endpoint until completion/failure with correct status transitions."
    - validator: "Integration Test"
      focus: "CLI commands create project, add document, trigger ingestion, and confirm job success using the pipeline from B2.3a."

  handoffContext:
    completed: [
      "R2.3_Bootstrap-Workflow research"
    ]
    interfaces:
      - "API endpoints: `/api/v1/projects`, `/api/v1/documents`, `/api/v1/jobs/{id}`."
      - "CLI commands: `ingest auth login`, `ingest project create`, `ingest document add`, `ingest document ingest --wait`."
      - "Queue producer: `enqueue_ingestion_job(document_id: UUID) -> None`."
    assumptions:
      - "Authentication provider issues device authorization codes and JWT access tokens."
      - "Redis (or equivalent) available for idempotency cache."
      - "Message queue aligns with B2.3a configuration."
    nextMission: "B2.3c: Integration & Parity Validation"
    blockers: []
