# Mission File: B5.2_FastAPI-Auth-CORS-Hardening.yaml

missionId: "B5.2"

objective: "Implement production-grade JWT authentication plus restrictive CORS in FastAPI, ensuring the hosted UI authenticates securely against the Railway backend."

context: |
  `docs/auth_and_cors_guidance.md` (lines 2-82) defines the security baseline: token-based auth,
  explicit origin lists, and HTTPS-only communication. With the hosted UI arriving in B5.1, the API
  must expose login/refresh endpoints, hash credentials, issue/validate JWTs, and gate sensitive
  routes. FastAPI currently allows `allow_origins=["*"]` in development (`app/main.py:19-26`), so
  production configs need to enumerate the frontend domain(s) and tighten methods/headers. Frontend
  hooks in `frontend/src/lib/api/missions.ts` will send `Authorization` headers once the auth flow
  ships.

successCriteria:
  - "New `/api/v1/auth/login` (and optional refresh/logout) endpoints validate credentials via passlib-hashed secrets and issue JWTs with configurable expiration."
  - "Reusable dependency (e.g., `get_current_user`) protects mission/quality/monitoring routes; unauthorized requests return 401 with actionable errors."
  - "CORS middleware updated to load allowed origins/methods/headers from settings, defaulting to the hosted UI + Cloudflare domain in production while keeping localhost for dev."
  - "Frontend updated to store JWT securely (HttpOnly cookie or bearer token) and include it in API calls; documentation covers storage + refresh strategy."
  - "Automated tests (pytest) cover auth flows, JWT validation edge cases, and CORS behavior; results recorded in telemetry."

deliverables:
  - "`app/api/v1/auth.py` (or equivalent) exposing login/refresh endpoints using passlib + python-jose."
  - "Config additions (`settings.allowed_origins`, token lifetime, secret rotation guidance)."
  - "Frontend changes (hooks/utilities) to request/login/logout and propagate tokens."
  - "Docs update (auth guidance + frontend README) explaining the flow."
  - "Telemetry/test artifacts (pytest auth suite, curl examples)."

domainFields:
  type: "Build.Implementation.v1"

  researchFoundation:
    - finding: "Production must restrict CORS origins and specify headers/methods."
      sourceMission: "docs/auth_and_cors_guidance.md:6-47"
    - finding: "Token-based authentication with JWTs recommended (passlib + python-jose)."
      sourceMission: "docs/auth_and_cors_guidance.md:50-76"
    - finding: "Frontend depends on REST hooks in `frontend/src/lib/api/missions.ts`."
      sourceMission: "frontend/src/lib/api/missions.ts:1-50"

  implementationScope:
    coreDeliverable: "Secure auth layer + CORS config matched to hosted UI domain."
    outOfScope:
      - "OAuth or SSO providers (local JWT only)."
      - "RBAC/ACL beyond authenticated vs anonymous."
      - "DNS / Cloudflare wiring (B5.3)."
      - "Frontend feature additions unrelated to auth."

  validationProtocol:
    - validator: "pytest tests/api/test_auth.py"
      focus: "Login, refresh, token validation, unauthorized access."
    - validator: "Manual curl/Postman"
      focus: "Cross-origin requests succeed only from allowed domain."
    - validator: "Frontend smoke"
      focus: "UI flows succeed with JWT storage pattern."

  handoffContext:
    completed:
      - "JWT auth endpoints + dependencies implemented."
      - "CORS config toggles per environment documented."
      - "Frontend auth hooks + instructions completed."
    interfaces:
      - "POST /api/v1/auth/login -> { access_token, token_type }"
      - "Authorization: Bearer <token> on protected endpoints"
    assumptions:
      - "User credentials stored in PostgreSQL or env seeds (document exact source)."
    nextMission: "B5.3: Domain Wiring & Telemetry Validation"
    blockers: []
