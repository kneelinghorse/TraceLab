    - Hybrid search service implemented with weighted scoring
    - API supports search_mode parameter (semantic, keyword, hybrid)
    - Hybrid mode returns combined results sorted by weighted score
    - Performance benchmarks show hybrid adds <200ms latency
    - Precision improved by ≥15% vs semantic-only on test queries
    - Documentation explains scoring algorithm
  
