# pack.yaml - Metadata for the "Sprint Plan" Domain Pack
name: "Planning.SprintPlan.v1"
version: "1.0.0"
displayName: "Sprint Plan Orchestrator"
description: "Master backlog tracking research and build missions across sprints for the UX Research Repository."
author: "TraceLab Team"
schema: "./schemas/SprintPlan.v1.json"

---

# Mission File: project-main-backlog.yaml

missionId: "SP-TRACE-001"

objective: "Keep the TraceLab UX Research Repository roadmap, research, and build missions synchronized across sprints."

context: |
  This backlog reflects completed Sprint 00 research, completed Sprint 01, and Sprint 02 planning artifacts.
  It is the single source of truth for mission status, dependencies, and success metrics.

successCriteria:
  - "All Sprint 1 research and build missions complete with documented outcomes."
  - "Backlog updated whenever mission status changes or new research is initiated."
  - "Sprint transitions capture retrospectives and inform next-sprint planning."

deliverables:
  - "Continuously updated backlog.yaml with accurate mission states and dependencies."

domainFields:
  type: "Planning.SprintPlan.v1"

  sprints:
    - sprintId: "Sprint 00"
      title: "Foundational Research & Strategy"
      focus: "Establish architecture, roadmap, and technical research pillars."
      status: "Completed"
      missions:
        - { id: "R00.1", name: "UX Research Methods Landscape", status: "Completed" }
        - { id: "R00.2", name: "UX Research Lifecycle Synthesis", status: "Completed" }
        - { id: "R00.3", name: "Tool Adoption & Limitations Study", status: "Completed" }
        - { id: "R00.4", name: "AI Scale & Strategy Analysis", status: "Completed" }
        - { id: "R00.5", name: "Methodological Framework for AI-Assisted Research", status: "Completed" }
        - { id: "R00.6", name: "Augmenting UX Research with AI", status: "Completed" }
        - { id: "TR-01", name: "Mission Protocol Validation", status: "Completed" }
        - { id: "TR-02", name: "PII Detection & Redaction", status: "Completed" }
        - { id: "TR-03", name: "RAG Cost Optimization", status: "Completed" }
        - { id: "TR-04", name: "Qdrant Railway Optimization", status: "Completed" }

    - sprintId: "Sprint 01"
      title: "Foundation Build - Ingestion & Redaction"
      focus: "Build the core service, synthetic corpus workflow, redaction pipeline, ingestion, and vector storage."
      status: "Completed"
      missions:
        - { id: "R1.1", name: "Presidio Evaluation Strategic Framework", status: "Completed", reference: "cmos/missions/research/R1.1_Presidio-Evaluation-Strategic-Framework.md" }
        - { id: "R1.2", name: "UX Research Document Types Taxonomy", status: "Completed", reference: "cmos/missions/research/R1.2_UX-Research-Document-types.md" }
        - { id: "B1.1", name: "Core Service Bootstrap", status: "Completed", completed_at: "2025-10-31T16:50:56.319057Z", notes: "FastAPI scaffold with PostgreSQL, Alembic migrations, Docker setup, and health checks created" }
        - { id: "B1.2", name: "Synthetic Corpus Pipeline", status: "Completed", completed_at: "2025-10-31T18:11:31.324870Z", notes: "Corpus generator, Presidio evaluator, CLI scripts, and documentation implemented. Ready for corpus generation and baseline evaluation." }
        - { id: "B1.3", name: "Presidio Redaction Service", status: "Completed", completed_at: "2025-10-31T19:23:53.523961Z", notes: "Presidio service with en_core_web_lg, custom recognizers (PARTICIPANT_ID, PROJECT_ID), Faker-based pseudonymization, FastAPI routes, and regression evaluation script. Ready for corpus-based testing once corpus is generated." }
        - { id: "B1.4", name: "Document Ingestion Pipeline", status: "Completed", completed_at: "2025-10-31T20:29:59.638320Z", notes: "Upload endpoints, format parsers (PDF/DOCX/PPTX/CSV/XLSX), redaction integration, chunking service (500-1000 tokens with overlap), status tracking, and coverage report generator implemented" }
        - { id: "B1.5", name: "Embedding & Qdrant Bootstrap", status: "Completed", completed_at: "2025-10-31T21:32:11.112294Z", notes: "OpenAI text-embedding-3-small service with batch support and exponential backoff, Qdrant collection with on_disk storage, scalar quantization (int8), HNSW indexing (m=16, ef_construct=100), payload indexes for filtering, retrieval service, CLI for processing pending chunks, and performance metrics collection implemented" }
        - { id: "B1.6", name: "Sprint Efficacy Evaluator", status: "Completed", completed_at: "2025-10-31T23:29:45.256990Z", notes: "Sprint evaluation script implemented: ingests backlog.yaml and telemetry artifacts, evaluates success criteria against metrics, generates Markdown/JSON reports with recommendations. Script executes successfully and produces sprint-01-summary.md" }
        - { id: "B1.7", name: "Presidio Recall Tuning", status: "Completed", completed_at: "2025-11-01T01:44:21.286028Z", reference: "cmos/missions/sprint-01/B1.7_Presidio-Recall-Tuning.yaml", notes: "Priority entity recall >=0.95 after analyzer span normalization and flexible phone recognizer rollout" }
        - { id: "B1.8", name: "Format Coverage Completion", status: "Completed", completed_at: "2025-11-01T02:48:31.062568Z", reference: "cmos/missions/sprint-01/B1.8_Format-Coverage-Completion.yaml", notes: "Generated ingestion_format_coverage.json with 5/5 formats chunked after end-to-end pipeline validation" }
        - { id: "B1.9", name: "Qdrant Latency Optimization", status: "Completed", completed_at: "2025-11-01T03:16:26.835992Z", reference: "cmos/missions/sprint-01/B1.9_Qdrant-Latency-Optimization.yaml", notes: "Adaptive hnsw_ef tiers (96/108/120) bring top_k=20 latency to 9.6ms without recall regressions." }

    - sprintId: "Sprint 02"
      title: "RAG Query & Semantic Optimization"
      focus: "Implement RAG query interface, semantic caching, and tiered LLM responses."
      status: "Planned"
      missions:
        - { id: "R2.1", name: "Quality Assessment Heuristics", status: "Completed", reference: "cmos/missions/research/R2.1_Heuristics-for-Tiered-LLM-Routing.md", notes: "Comprehensive heuristics framework for detecting low-confidence LLM responses: three-pillar approach (Linguistic Uncertainty, Answer Integrity, Source Provenance) with pattern libraries, scoring algorithms, and escalation decision tree documented." }
        - { id: "B2.1", name: "RAG Query API", status: "Completed", completed_at: "2025-11-01T15:12:07.554158Z", reference: "cmos/missions/sprint-02/B2.1_RAG-Query-API.yaml", notes: "FastAPI /api/v1/search endpoint returns GPT-4o-mini answers with citations, latency metrics, and integration tests." }
        - { id: "B2.2", name: "Context Compression Pipeline", status: "Completed", completed_at: "2025-11-04T15:05:39.648853Z", reference: "cmos/missions/sprint-02/B2.2_Context-Compression-Pipeline.yaml", notes: "Context compression service filters chunks at 0.7 cosine threshold, exposes metrics, integrates with RAG run path, and ships unit coverage for threshold + fallback behaviour." }
        - { id: "B2.3", name: "Semantic Cache Layer", status: "Queued", reference: "cmos/missions/sprint-02/B2.3_Semantic-Cache-Layer.yaml", notes: "Unblocked by onboarding API delivery; proceed with cache integration once B2.3d starts." }
        - { id: "B2.3a", name: "Markdown Ingestion Pipeline", status: "Completed", completed_at: "2025-11-05T01:16:32.331381Z", reference: "cmos/missions/sprint-02/B2.3a_Markdown-Ingestion-Pipeline.yaml", notes: "Watcher, queue, ingestion worker, Qdrant integration, and docs delivered for Markdown pipeline." }
        - { id: "B2.3b", name: "Onboarding API", status: "Completed", completed_at: "2025-11-05T18:25:56.128396Z", reference: "cmos/missions/sprint-02/B2.3b_Onboarding-API.yaml", notes: "Delivered idempotent onboarding API with project/document CRUD and async ingestion job runner." }
        - { id: "B2.3c", name: "Ingestion Integration & Parity", status: "Completed", completed_at: "2025-11-05T15:28:48.554772Z", reference: "cmos/missions/sprint-02/B2.3c_Ingestion-Integration-Parity.yaml", notes: "CLI-driven ingestion flow, parity reports, and observability assets landed." }
        - { id: "B2.3d", name: "Semantic Cache Implementation", status: "Completed", completed_at: "2025-11-05T20:15:54.388045Z", reference: "cmos/missions/sprint-02/B2.3d_Semantic-Cache-Implementation.yaml", notes: "Semantic cache integrated with RAG pipeline, TTL & size eviction policies, Prometheus metrics, and 20% workload hit-rate validation." }
        - { id: "B2.4", name: "Tiered LLM Routing", status: "Current", reference: "cmos/missions/sprint-02/B2.4_Tiered-LLM-Routing.yaml", notes: "Implement tiered routing with R2.1 quality assessment: default GPT-4o-mini, escalate to GPT-4o on low-confidence, target <10% escalation rate." }
        - { id: "B2.5", name: "Sprint Efficacy Evaluator", status: "Queued", reference: "cmos/missions/sprint-02/B2.5_Sprint-Efficacy-Evaluator.yaml", notes: "Automated evaluation script for Sprint 02 metrics: RAG performance, semantic cache hit rate, context compression effectiveness, tiered routing escalation rate, and cost analysis." }

