      notes: 'JWT auth + CORS hardening shipped: added /api/v1/auth login+refresh
        using passlib+jose, centralized security helpers, locked routers behind bearer
        dependencies, and loaded explicit origins/methods from settings. Frontend
        now gates missions behind AuthGate/LoginPanel, persists tokens, and routes
