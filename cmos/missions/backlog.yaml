        tests/test_document_ingestion.py::test_upload_and_process_endpoints_record_statuses.'
      metadata:
        description: Implement JWT auth endpoints and lock down CORS/methods to the
          hosted UI domain per docs/auth_and_cors_guidance.md.
        successCriteria:
        - Login endpoint issues JWTs signed with python-jose and passlib-hashed credentials.
        - Protected routes require Authorization bearer tokens; unauthenticated calls
          return 401 with helpful errors.
        - CORS middleware loads explicit origins/methods/headers from settings (prod
          vs dev).
        - Frontend stores/uses tokens and docs describe the auth flow.
        deliverables:
        - New auth routes, schemas, and settings toggles.
        - pytest coverage for login/refresh + CORS behavior.
        - Docs/README updates covering token handling + allowed origins.
