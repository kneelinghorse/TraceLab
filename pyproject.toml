# ABOUTME: Consolidated Python project configuration for TraceLab.
# ABOUTME: Replaces requirements.txt as primary dependency source; includes ruff, mypy, pytest config.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelab"
version = "1.0.0"
description = "Agent-first research platform for document analysis and synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",

    # Utilities
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "Jinja2==3.1.2",
    "prometheus-client==0.18.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    "requests==2.31.0",
    "cachetools==5.3.2",

    # Corpus Generation & PII Detection
    "faker==19.12.0",
    "python-docx==1.1.0",
    "reportlab==4.0.7",
    "pdfminer.six==20231228",

    # Document Parsing
    "pypdf==4.0.1",
    "python-pptx==0.6.23",
    "pandas==2.3.1",
    "openpyxl==3.1.2",

    # Vector Database & Embeddings
    "qdrant-client==1.12.0",
    "openai>=1.58.0",
    "tiktoken>=0.8.0",

    # CLI
    "click==8.1.7",
    "rich==13.7.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # Async support (mcp requires anyio>=4.5)
    "anyio>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "sqlalchemy[mypy]",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.0.0",
]

[project.scripts]
tracelab = "cli.main:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

# --- Ruff ---

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "B008"]  # E501: line length relaxed; B008: FastAPI Depends() in default args

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["E402"]

# --- Mypy ---

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.ports.*"
disallow_untyped_defs = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Pure unit tests, no external deps",
    "integration: Requires database or external services",
    "e2e: End-to-end API or browser tests",
    "slow: Tests taking >10s",
]
addopts = "--strict-markers -v --tb=short"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/templates/*", "alembic/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
