# ABOUTME: Builds the frontend exactly as a production install on supported Node.
# ABOUTME: Guards required admin routes independently from the legacy test workflow.

name: Frontend Production Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  build-frontend-production:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Reject tests under Next.js pages
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d src/pages ]]; then
            echo "Expected frontend/src/pages to exist." >&2
            exit 1
          fi

          forbidden_path="$(
            find src/pages \
              \( \
                -name '*.test.*' \
                -o -name '*.spec.*' \
                -o -name '__tests__' \
                -o -name '__mocks__' \
              \) \
              -print -quit
          )"

          if [[ -z "$forbidden_path" ]]; then
            echo "No test files or test directories found under frontend/src/pages."
            exit 0
          fi

          echo "Test files and test directories are not allowed under frontend/src/pages:" >&2
          find src/pages \
            \( \
              -name '*.test.*' \
              -o -name '*.spec.*' \
              -o -name '__tests__' \
              -o -name '__mocks__' \
            \) \
            -print | sed 's/^/  /' >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production frontend dependencies
        working-directory: frontend
        run: npm ci --omit=dev
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify admin routes are in the production artifact
        working-directory: frontend
        run: >-
          node -e 'const pages = require("./.next/server/pages-manifest.json");
          for (const route of ["/admin/users", "/admin/spaces"])
          if (!pages[route]) throw new Error(`Missing production route: ${route}`);'
