# ABOUTME: Builds the frontend exactly as a production install on supported Node.
# ABOUTME: Guards required admin routes independently from the legacy test workflow.

name: Frontend Production Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  build-frontend-production:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Reject tests under Next.js pages
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d src/pages ]]; then
            echo "Expected frontend/src/pages to exist." >&2
            exit 1
          fi

          forbidden_path="$(
            find src/pages \
              \( \
                -name '*.test.*' \
                -o -name '*.spec.*' \
                -o -name '__tests__' \
                -o -name '__mocks__' \
              \) \
              -print -quit
          )"

          if [[ -z "$forbidden_path" ]]; then
            echo "No test files or test directories found under frontend/src/pages."
            exit 0
          fi

          echo "Test files and test directories are not allowed under frontend/src/pages:" >&2
          find src/pages \
            \( \
              -name '*.test.*' \
              -o -name '*.spec.*' \
              -o -name '__tests__' \
              -o -name '__mocks__' \
            \) \
            -print | sed 's/^/  /' >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production frontend dependencies
        working-directory: frontend
        run: npm ci --omit=dev
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify admin routes are in the production artifact
        working-directory: frontend
        run: >-
          node -e 'const pages = require("./.next/server/pages-manifest.json");
          for (const route of ["/admin/users", "/admin/spaces"])
          if (!pages[route]) throw new Error(`Missing production route: ${route}`);'
      - name: Install browser test dependencies after the production build
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Verify shell behavior against the production artifact
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          PLAYWRIGHT_TELEMETRY_OUTPUT: ${{ runner.temp }}/shell-browser-tests.json
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/shell-server.log" 2>&1 &
          shell_server_pid=$!
          trap 'kill "$shell_server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3100/missions > /dev/null || exit $?
          npx playwright test tests/e2e/app-shell.spec.ts tests/e2e/mission-protocol.spec.ts tests/e2e/project-bundles.spec.ts tests/e2e/collection-context.spec.ts tests/e2e/search-command.spec.ts tests/e2e/route-migration.spec.ts tests/e2e/graph.spec.ts --workers=1 || exit $?
      - name: Archive route migration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-route-migration-coverage
          path: frontend/test-results/**/route-migration-coverage.json
          if-no-files-found: error
