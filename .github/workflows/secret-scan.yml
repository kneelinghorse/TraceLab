# ABOUTME: Blocks hard-coded credential assignments in tracked repository files.
# ABOUTME: Runs independently from the broader test workflow on every push and pull request.

name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-credential-literals:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject hard-coded credential literals
        run: python scripts/check_no_credential_literals.py --tracked
      - name: Reject personal email addresses in receipts
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as directory:
              receipt = Path(directory) / "receipt.json"
              receipt.write_text('{"email":"participant@unapproved-domain.com"}')
              result = subprocess.run([sys.executable, "-m", "scripts.check_receipt_emails", str(receipt)], capture_output=True)
              assert result.returncode == 1, "Email guard did not reject fixture"
              assert b"unapproved-domain.com" not in result.stderr, "Email guard leaked its finding"
          PY
          python -m scripts.check_receipt_emails --tracked
