# ABOUTME: Blocks hard-coded credential assignments in tracked repository files.
# ABOUTME: Runs independently from the broader test workflow on every push and pull request.

name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-credential-literals:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject hard-coded credential literals
        run: python scripts/check_no_credential_literals.py --tracked
