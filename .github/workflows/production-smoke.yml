# ABOUTME: Exercises the public production frontend and API every six hours.
# ABOUTME: Also supports manual post-deploy verification without stored secrets.

name: Production Smoke

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: "https://tracelab.aquex.ai"
      PLAYWRIGHT_SKIP_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run production smoke suite
        working-directory: frontend
        run: npx playwright test tests/e2e/production-smoke.spec.ts
