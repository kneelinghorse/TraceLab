# ABOUTME: Runs the production RBAC role x route matrix on MANUAL DISPATCH ONLY and fails loudly.
# ABOUTME: A run that cannot even start is a FAILURE here, never a skip — that silence cost five sprints.
# ABOUTME: The six-hourly schedule was removed 2026-09-16; see the DISARMED note below.

name: RBAC Verify (production)

# Sprint 55 RBAC-3. Production RBAC verification was silently unrunnable for roughly
# five sprints. Nothing reported it, because RUNNING the matrix is the only thing that
# detects the matrix having stopped. That problem is real and still unsolved, but the
# cron-plus-dispatch shape borrowed from decision #353 was the wrong fix for it here —
# see DISARMED below.
# DISARMED 2026-09-16. The six-hourly `schedule:` trigger was REMOVED, deliberately
# and by Derek's direct instruction. scripts/rbac_verify.py::run() unconditionally
# provisions four real user accounts in the target environment via POST /admin/users
# (a hardcoded throwaway password, plus minted API keys) and purges them at the end.
# On a cron that meant creating and deleting real production accounts every six hours,
# forever, with a reconcile sweep that exists precisely because teardown is expected to
# leak rows when a run is cancelled or crashes. A role x route enforcement check must
# never mutate a production auth table. Manual dispatch is retained so the matrix stays
# runnable on purpose; it must not run on its own until the harness is reworked to use
# permanent, pre-existing, zero-privilege principals instead of provisioning any.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two concurrent matrices would provision throwaway principals against the same
  # fixture project and race each other's teardown. Never cancel a run in flight:
  # a cancelled run can leave throwaway users behind.
  group: rbac-verify-production
  cancel-in-progress: false

jobs:
  rbac-verify:
    name: rbac-verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: python -m pip install --quiet httpx

      # The credential check is a STEP, not an `if:` guard on the job. A guarded job
      # reports "skipped", which renders green — indistinguishable from a passing run
      # at a glance, and precisely the silence this mission exists to remove.
      - name: Verify credentials are configured
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          missing=""
          [ -n "$AUTH_USERNAME" ] || missing="$missing AUTH_USERNAME"
          [ -n "$AUTH_PASSWORD" ] || missing="$missing AUTH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=RBAC verification cannot start::Missing repository secret(s):$missing"
            echo "The production RBAC matrix did NOT run. This is a FAILURE, not a skip:"
            echo "an unrunnable verifier is the exact condition that went unnoticed for"
            echo "five sprints. Set the secrets to a dedicated verification identity"
            echo "(a real, routable address — not the retired @tracelab.local bootstrap row)."
            exit 1
          fi
          echo "Credentials present; the matrix will run as $AUTH_USERNAME."

      - name: Run the production RBAC matrix
        id: matrix
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          set -o pipefail
          python scripts/rbac_verify.py \
            --base-url https://api.tracelab.aquex.ai \
            2>&1 | tee rbac-verify-production.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # Exit 2 is a setup/precheck abort — the harness could not even start.
          # It must be as loud as a real enforcement gap, never quieter.
          if [ "$status" = "2" ]; then
            echo "::error title=RBAC verification could not start::The harness aborted during setup (exit 2). Nothing was verified. See the log above for the named reason."
          elif [ "$status" != "0" ]; then
            echo "::error title=RBAC enforcement gap in production::scripts/rbac_verify.py exited $status. A role x route check that should have been denied was not."
          fi
          exit "$status"

      - name: Archive the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-verify-production-log
          path: rbac-verify-production.log
          if-no-files-found: error
          retention-days: 90
