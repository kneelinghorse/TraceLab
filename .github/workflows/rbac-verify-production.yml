# ABOUTME: Runs the production RBAC role x route matrix on MANUAL DISPATCH ONLY and fails loudly.
# ABOUTME: A run that cannot even start is a FAILURE here, never a skip — that silence cost five sprints.
# ABOUTME: Still dispatch-only: the schedule returns once the principals exist (see below).

name: RBAC Verify (production)

# Sprint 55 RBAC-3. Production RBAC verification was silently unrunnable for roughly
# five sprints. Nothing reported it, because RUNNING the matrix is the only thing that
# detects the matrix having stopped. That problem is real and STILL UNSOLVED while this
# workflow only runs when a human remembers to press the button.
#
# DISARMED 2026-09-16, by Derek's direct instruction: scripts/rbac_verify.py::run()
# provisioned four real accounts via POST /admin/users, minted API keys for them and
# purged them at the end, so a six-hourly cron meant creating and deleting real
# production accounts every six hours, forever.
#
# Sprint 56 RBAC-5 fixed the CAUSE. The harness no longer creates a user at all: it
# authenticates as permanent, pre-existing, zero-privilege principals supplied in
# RBAC_VERIFY_PRINCIPALS, and tests/test_rbac_verify_harness.py asserts at the
# transport that a run issues no POST/PATCH/PUT/DELETE against /admin/users. The
# reconcile-users sweep is gone with the hazard it existed for.
#
# The schedule is STILL REMOVED, and that is deliberate rather than leftover. The one
# remaining precondition is operator work that cannot be automated without recreating
# the problem: someone must create the principals once, on purpose, in production, and
# set them as a repository secret. Re-add the `schedule:` trigger below once they
# exist — the suggested slot is "25 */6 * * *", offset from Production Smoke at ":55"
# so the two never contend for the login rate limit (5 logins / 60s,
# app/core/rate_limit.py). Note the budget is exactly spent: a run performs five
# logins (the owner plus four principals) with zero headroom.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two concurrent matrices would seed and tear down children inside the same fixture
  # projects and race each other. Never cancel a run in flight: a cancelled run can
  # leave seeded artifacts behind for the next run's reconcile sweep to clean up.
  group: rbac-verify-production
  cancel-in-progress: false

jobs:
  rbac-verify:
    name: rbac-verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: python -m pip install --quiet httpx

      # The credential check is a STEP, not an `if:` guard on the job. A guarded job
      # reports "skipped", which renders green — indistinguishable from a passing run
      # at a glance, and precisely the silence this mission exists to remove.
      - name: Verify credentials are configured
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          RBAC_VERIFY_PRINCIPALS: ${{ secrets.RBAC_VERIFY_PRINCIPALS }}
        run: |
          missing=""
          [ -n "$AUTH_USERNAME" ] || missing="$missing AUTH_USERNAME"
          [ -n "$AUTH_PASSWORD" ] || missing="$missing AUTH_PASSWORD"
          [ -n "$RBAC_VERIFY_PRINCIPALS" ] || missing="$missing RBAC_VERIFY_PRINCIPALS"
          if [ -n "$missing" ]; then
            echo "::error title=RBAC verification cannot start::Missing repository secret(s):$missing"
            echo "The production RBAC matrix did NOT run. This is a FAILURE, not a skip:"
            echo "an unrunnable verifier is the exact condition that went unnoticed for"
            echo "five sprints. Set AUTH_USERNAME/AUTH_PASSWORD to a dedicated"
            echo "verification identity (a real, routable address — not the retired"
            echo "@tracelab.local bootstrap row), and RBAC_VERIFY_PRINCIPALS to a JSON"
            echo "object of PERMANENT, pre-existing, zero-privilege accounts:"
            echo '  {"member":{"email":"...","password":"..."},'
            echo '   "viewer":{"email":"...","password":"..."}}'
            echo "member and viewer are the two deny tiers and are required; add"
            echo "second_owner and service to unlock the remaining checks. Sprint 56"
            echo "RBAC-5: the harness no longer creates these itself, because a"
            echo "role x route check must never write to the auth table it verifies."
            exit 1
          fi
          # GitHub masks a secret's value wherever it appears in the log, so
          # "will run as $AUTH_USERNAME" renders as "will run as ***" and tells the
          # operator nothing — the line looked like confirmation while confirming
          # nothing (next-step #374, learning #229). Print two DERIVED facts
          # instead. Neither is the secret value, so neither is masked, and
          # together they identify which identity is configured.
          case "$AUTH_USERNAME" in
            *@*)
              domain="${AUTH_USERNAME##*@}"
              local_part="${AUTH_USERNAME%@*}"
              echo "Credentials present. The matrix will run as a ${#local_part}-character local part at ${domain}."
              ;;
            *)
              echo "Credentials present, but AUTH_USERNAME contains no '@'."
              echo "The harness refuses a bare username and will abort with exit 2"
              echo "in the next step; it is the authority on that refusal, not this check."
              ;;
          esac

      - name: Run the production RBAC matrix
        id: matrix
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          RBAC_VERIFY_PRINCIPALS: ${{ secrets.RBAC_VERIFY_PRINCIPALS }}
        run: |
          set -o pipefail
          python scripts/rbac_verify.py \
            --base-url https://api.tracelab.aquex.ai \
            2>&1 | tee rbac-verify-production.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # Exit 2 is a setup/precheck abort — the harness could not even start.
          # It must be as loud as a real enforcement gap, never quieter.
          if [ "$status" = "2" ]; then
            echo "::error title=RBAC verification could not start::The harness aborted during setup (exit 2). Nothing was verified. See the log above for the named reason."
          elif [ "$status" != "0" ]; then
            echo "::error title=RBAC enforcement gap in production::scripts/rbac_verify.py exited $status. A role x route check that should have been denied was not."
          fi
          exit "$status"

      - name: Archive the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-verify-production-log
          path: rbac-verify-production.log
          if-no-files-found: error
          retention-days: 90
