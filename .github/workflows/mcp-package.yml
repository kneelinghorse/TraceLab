name: MCP Package

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  mcp-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/tracelab-mcp/package-lock.json
      - name: Install package dependencies
        working-directory: packages/tracelab-mcp
        run: npm ci || exit $?
      - name: Verify UI parity audit intent
        run: node --test scripts/mcp_parity_audit.test.mjs || exit $?
      - name: Audit live UI operations against MCP source actions
        run: node scripts/mcp_parity_audit.mjs || exit $?
      - name: Verify unit contracts
        working-directory: packages/tracelab-mcp
        run: npm run test:run || exit $?
      - name: Verify installed tarball through the real MCP client
        working-directory: packages/tracelab-mcp
        run: npm run test:package || exit $?
