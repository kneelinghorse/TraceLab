# Mission File: B2.3_Semantic-Cache-Layer.yaml

missionId: "B2.3"

objective: "Implement semantic caching layer to store query embeddings and responses in Qdrant, achieving 15-20% cache hit rate, backed by the Markdown-native ingestion pipeline and onboarding API."

context: |
  Implements the semantic caching roadmap goal while resolving the ingestion blockers documented in R2.2 and R2.3. The cache can only be validated once Markdown research assets stream into Qdrant through a first-class ingestion service and projects/documents can be registered without manual SQL.
  
  Key architectural guidance:
  - R2.2 (Markdown Ingestion Service) mandates a Node.js/unified pipeline with chokidar-based file watching, a durable message queue, remark plugins for chunking, and a Qdrant payload schema that preserves heading hierarchies and front matter.
  - R2.3 (Project Bootstrap Workflow) defines the asynchronous onboarding API with idempotent endpoints, saga-style compensating actions, and seams for future authentication if a multi-user deployment is ever required.
  - Semantic cache collections must coexist with ingestion output—cache metadata should reference the same project/document identifiers produced by the onboarding workflow so operations remain consistent end-to-end.

successCriteria:
  - "Semantic cache collection created in Qdrant (separate from document chunks collection)."
  - "Markdown ingestion service implemented per R2.2: chokidar watcher, queue-backed ingestion workers using unified/remark chunking, and Qdrant payload schema (doc_type, source_uri, heading_trail, chunk_hash)."
  - "Query embedding → similarity search against cached queries (threshold 0.90-0.95)."
  - "Cache hit detection: if similarity above threshold, return cached response immediately."
  - "Cache miss: proceed with full RAG pipeline, then store query+response in cache."
  - "Cache management: TTL and size limits implemented to prevent unbounded growth."
  - "Cache hit rate achieves 15-20% target (measured over representative query volume)."
  - "Onboarding API delivered per R2.3 with idempotency keys and asynchronous ingestion job polling so projects/documents can be registered without direct SQL."
  - "Operational telemetry (OpenTelemetry traces, ingestion metrics, cache hit/miss counters) emitted for ingestion, onboarding, and cache lookups."

deliverables:
  - "Semantic cache service module with Qdrant integration."
  - "Cache lookup logic with similarity threshold checking."
  - "Cache storage workflow (store query embedding + response after generation)."
  - "Cache management utilities (TTL expiration, size-based eviction)."
  - "Integration with B2.1/B2.2 pipeline (check cache before RAG, store after generation)."
  - "Markdown ingestion service components: chokidar watcher, message queue configuration, unified/remark ingestion worker, Qdrant payload schema implementation."
  - "Onboarding API (FastAPI) implementing asynchronous job pattern, idempotency safeguards, and saga-based compensations."
  - "Telemetry + tracing instrumentation covering ingestion pipeline, onboarding API, and cache operations."
  - "Metrics collection for cache performance analysis."
  - "Configuration for similarity threshold (default 0.90-0.95 range)."

