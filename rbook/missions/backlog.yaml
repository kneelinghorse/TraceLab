    - id: B21.8
      name: RagService PEDR Integration
      status: Completed
      completed_at: '2025-12-11T05:13:02.727Z'
      notes: "## Implementation Details\n\n### 1. Replace HybridSearchService in RagService\n\
        \n**File: app/services/rag_service.py**\n\n**Remove:**\n```python\nfrom app.services.hybrid_search\
        \ import HybridSearchService\nself.hybrid_search_service = hybrid_search_service\
        \ or HybridSearchService(...)\n```\n\n**Add:**\n```python\nfrom app.services.pedr.search_orchestrator\
        \ import create_pedr_orchestrator, PEDRSearchOrchestrator\nself.pedr_orchestrator\
        \ = create_pedr_orchestrator()\n```\n\n### 2. Update _execute_rag_pipeline\
        \ (line ~210-308)\n\n**Replace retrieval call (line ~286-308):**\n```python\n\
        # OLD: self.hybrid_search_service.search(...)\n# NEW:\npedr_response = self.pedr_orchestrator.search(\n\
        \    query=query,\n    top_k=top_k,\n    project_id=project_id,\n    document_id=document_id,\n\
        \    source_type=source_type,\n    document_types=document_types,\n    source_types=source_types,\n\
        \    date_from=date_from,\n    date_to=date_to,\n    tags=tags,\n    hnsw_ef=hnsw_ef,\n\
        \    include_embeddings=True,  # Need embeddings for compression\n)\n\n# Convert\
        \ PEDR results to dict format for compression\nretrieved_chunks = [\n    {\n\
        \        'chunk_id': r.chunk_id,\n        'content': r.content,\n        'document_id':\
        \ r.document_id,\n        'project_id': r.project_id,\n        'chunk_index':\
        \ r.chunk_index,\n        'source_type': r.source_type,\n        'score':\
        \ r.rrf_score,\n        'embedding': r.embedding,  # For compression\n   \
        \ }\n    for r in pedr_response.results\n]\n```\n\n### 3. Map search_mode\
        \ to PEDR rerank_mode\n\n```python\n# search_mode='semantic' or 'hybrid' ->\
        \ rerank_mode='full' or 'hybrid'\nrerank_mode = 'hybrid' if normalized_mode\
        \ == 'hybrid' else 'full'\n```\n\n### 4. Update tests\n\n**File: tests/test_rag_service.py**\n\
        - Mock `create_pedr_orchestrator` instead of `HybridSearchService`\n- Update\
        \ expected response format\n\n### Why This Fixes Search\n\nThe broken code\
        \ in HybridSearchService._normalize_scores (line 384-407):\n```python\nspan\
        \ = maximum - minimum\npayload[target_key] = (score - minimum) / span\n```\n\
        \nThis min-max normalization destroys score magnitude:\n- Semantic 0.92 and\
        \ Keyword 0.05 both become 1.0 if they're the 'best' in their category\n-\
        \ PEDR uses RRF which ranks by position, not normalized scores\n\n### Key\
        \ Code References\n- RagService retrieval: app/services/rag_service.py:286-308\n\
        - Broken normalization: app/services/hybrid_search.py:384-407\n- PEDR RRF\
        \ fusion: app/services/pedr/fusion.py | [Completed] ## Completed: RagService\
        \ PEDR Integration\n\n### Changes Made\n\n**1. app/services/rag_service.py**\n\
        - Replaced `HybridSearchService` import with `PEDRSearchOrchestrator` imports\n\
        - Changed `__init__` parameter from `hybrid_search_service` to `pedr_orchestrator`\n\
        - Updated service initialization to use `create_pedr_orchestrator()` factory\n\
        - Modified `_execute_rag_pipeline()` to:\n  - Call `self.pedr_orchestrator.search()`\
        \ instead of `self.hybrid_search_service.search()`\n  - Convert `PEDRSearchResult`\
        \ objects to dict format for context compression\n  - Use `rrf_score` instead\
        \ of min-max normalized scores\n\n**2. tests/test_rag_service.py**\n- Added\
        \ `PEDRSearchResponse`, `PEDRSearchResult`, `PEDRMetadata`, `LayerTimings`\
        \ imports\n- Created `_FakePEDROrchestrator` test class that returns proper\
        \ `PEDRSearchResponse`\n- Updated all 6 RAG service unit tests to use `pedr_orchestrator`\
        \ parameter\n- All 6 unit tests pass\n\n**3. tests/conftest.py**\n- Added\
        \ `test_rag_service` to skip_patterns for database reset fixture\n\n### Why\
        \ This Fixes Search\n\nThe broken code in `HybridSearchService._normalize_scores`\
        \ destroyed score magnitude:\n- Min-max normalization turned semantic 0.92\
        \ and keyword 0.05 both into 1.0 if they were \"best\" in their category\n\
        - PEDR uses RRF (Reciprocal Rank Fusion) which ranks by position, preserving\
        \ proper ranking\n\n### Test Results\n- 6/6 RAG service unit tests pass\n\
        - 44/44 PEDR unit tests pass  \n- 1 endpoint test fails due to pre-existing\
        \ starlette/httpx version incompatibility (unrelated to this change)"
