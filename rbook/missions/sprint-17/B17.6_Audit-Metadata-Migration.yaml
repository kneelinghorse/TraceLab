mission_id: B17.6
title: Add Missing Audit Metadata Fields
sprint: Sprint 17
status: Queued
track: Schema
priority: Medium

objective: |
  Add missing audit trail fields identified in R17.5 (Architecture Health Check).
  Improve traceability and support future multi-user scenarios.

context: |
  R17.5 identified these metadata gaps:

  | Table | Missing Field | Impact |
  |-------|--------------|--------|
  | documents | updated_at | Can't track document modifications |
  | reports | created_by | Can't audit report creators |
  | tags | created_at, updated_at | Can't track tag age |
  | missions | created_at index | Query performance |

  These are low-effort additions that improve data hygiene and audit capabilities.

success_criteria:
  - documents.updated_at column with auto-update trigger
  - reports.created_by column (nullable string)
  - tags.created_at and tags.updated_at columns
  - Index on missions.created_at
  - Migration is idempotent (safe to run multiple times)
  - Existing data has sensible defaults

deliverables:
  - alembic/versions/020_audit_metadata.py
  - Updated app/models/document.py (updated_at)
  - Updated app/models/report.py (created_by)
  - Updated app/models/tag.py (timestamps)

schema_changes: |
  -- Documents: Add updated_at with trigger
  ALTER TABLE documents ADD COLUMN updated_at TIMESTAMP DEFAULT NOW();
  UPDATE documents SET updated_at = uploaded_at WHERE updated_at IS NULL;

  -- PostgreSQL trigger for auto-update
  CREATE OR REPLACE FUNCTION update_updated_at_column()
  RETURNS TRIGGER AS $$
  BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
  END;
  $$ language 'plpgsql';

  CREATE TRIGGER update_documents_updated_at
      BEFORE UPDATE ON documents
      FOR EACH ROW
      EXECUTE FUNCTION update_updated_at_column();

  -- Reports: Add created_by
  ALTER TABLE reports ADD COLUMN created_by VARCHAR(100);

  -- Tags: Add timestamps
  ALTER TABLE tags ADD COLUMN created_at TIMESTAMP DEFAULT NOW();
  ALTER TABLE tags ADD COLUMN updated_at TIMESTAMP DEFAULT NOW();

  -- Missions: Add index
  CREATE INDEX IF NOT EXISTS idx_missions_created_at ON missions(created_at);

implementation_notes: |
  Use idempotent checks in migration:

  ```python
  def upgrade():
      bind = op.get_bind()
      inspector = inspect(bind)

      # Check if column exists before adding
      columns = [c['name'] for c in inspector.get_columns('documents')]
      if 'updated_at' not in columns:
          op.add_column('documents', sa.Column('updated_at', sa.DateTime, ...))

      # Similar checks for other columns...
  ```

  For SQLAlchemy model:

  ```python
  # In Document model
  updated_at = Column(
      DateTime,
      default=datetime.utcnow,
      onupdate=datetime.utcnow,
      nullable=True
  )
  ```

estimated_effort: 2 hours
estimated_tests: 5-8
dependencies: []
