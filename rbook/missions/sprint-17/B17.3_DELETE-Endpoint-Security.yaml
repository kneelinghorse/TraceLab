mission_id: B17.3
title: Add Authentication & Confirmation to DELETE Endpoints
sprint: Sprint 17
status: Queued
track: Security
priority: Critical

objective: |
  Secure destructive API endpoints to prevent accidental or unauthorized data loss.

  CRITICAL FINDING from R17.1: Project and document DELETE endpoints currently have
  NO authentication. Anyone with API access can delete entire projects and all
  cascaded data (documents, chunks, insights, missions) with a single call.

context: |
  Research mission R17.1 (Data Protection Audit) identified this as a P0 security gap.

  Current vulnerable endpoints:
  - DELETE /api/v1/projects/{id} - No auth, no confirmation
  - DELETE /api/v1/documents/{id} - No auth, no confirmation

  Impact of project deletion (CASCADE chain):
  - ALL documents in project deleted
  - ALL chunks from those documents deleted
  - ALL insights derived from project deleted
  - ALL missions associated with project deleted
  - Collection items orphaned
  - Report citation links broken

success_criteria:
  - DELETE /api/v1/projects/{id} requires authentication
  - DELETE /api/v1/documents/{id} requires authentication
  - Both endpoints require confirm=true query parameter
  - Returns 401 Unauthorized without valid auth
  - Returns 400 Bad Request without confirm=true
  - Clear error messages explain requirements
  - Existing tests updated for new auth requirements
  - New tests verify auth + confirmation behavior

deliverables:
  - app/api/v1/projects.py - Add auth dependency + confirm param
  - app/api/v1/documents.py - Add auth dependency + confirm param
  - tests/test_projects_api.py - Update tests for auth
  - tests/test_documents_api.py - Update tests for auth

implementation_notes: |
  Pattern to follow for confirmation:

  ```python
  @router.delete("/{project_id}", status_code=status.HTTP_204_NO_CONTENT)
  async def delete_project(
      project_id: UUID,
      confirm: bool = Query(False, description="Must be true to delete"),
      db: Session = Depends(get_db),
      api_key: APIKey = Depends(require_api_key),  # ADD THIS
  ) -> None:
      if not confirm:
          raise HTTPException(
              status_code=400,
              detail="Project deletion requires confirm=true query parameter. "
                     "WARNING: This will delete all documents, chunks, and insights."
          )
      # ... existing delete logic
  ```

  Use existing require_api_key dependency from app/api/dependencies.py

estimated_effort: 4 hours
estimated_tests: 10-15
dependencies: []
