        Pass hnsw_ef to semantic layer search.

testing:
  benchmarks:
    - Run scripts/tune_hnsw.py to find optimal ef_search
    - Compare P50 latency before/after
    - Verify recall stays >95% with sample queries

  recall_validation:
    description: |
      Compare results at ef_search=128 (baseline) vs optimized value.
      Calculate overlap percentage - should be >95%.

reference_docs:
  - cmos/reports/sprint-19/qdrant-optimization-research.md
  - app/services/hybrid_search.py
  - app/services/embedding_service.py

notes: |
  IMPORTANT: ef_search is a query-time parameter, so changes take effect
  immediately without rebuilding the index. This makes tuning safe to test.

  The hnsw_ef parameter in SearchParams overrides collection default.
  Start with ef_search=64, measure, then try 48 if more reduction needed.

  If recall drops >5%, stick with ef_search=64 as the safe choice.
